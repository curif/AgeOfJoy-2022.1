# MR Custom Object v1 — copy folder to: {BaseDir}/MR/Custom Objects/TV/
# Requires: tv.glb, screen.mp4
# GLB must contain a child mesh named "Screen" (case-insensitive).

version: 1

name: TV
displayName: Televisão

model:
  file: tv.glb
  scale: 1.0
  rotation: { x: 0, y: 180, z: 0 }

placement:
  surfaceType: 0
  facingAxis: 0
  allowStickRotation: true
  stickRotationAxis: 0
  stickRotationSpeed: 90

collision:
  mode: mesh
  convex: true

components:
  - video
  - grab

video:
  file: screen.mp4
  target: Screen
  loop: true
  playOnAwake: true
  volume: 0.8

grab:
  twoHands: false
  returnOnRelease: true
  hideHands: true
