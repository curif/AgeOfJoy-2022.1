# MR Custom Object v1 — copy folder to: {BaseDir}/MR/Custom Objects/Lamp/
# Requires: lamp.glb
# Optional: rename the light emitter node in the GLB to Bulb (or change light.target)

version: 1

name: Lamp
displayName: Candeeiro

model:
  file: lamp.glb
  scale: 1.0
  offset: { x: 0, y: 0, z: 0 }

placement:
  surfaceType: 2
  facingAxis: 1
  allowStickRotation: true
  stickRotationAxis: 0
  stickRotationSpeed: 45

collision:
  mode: box

components:
  - light

light:
  # omit target to attach at package root if the GLB has no Bulb node
  target: Bulb
  type: point
  intensity: 1.5
  range: 3.5
  color: { r: 1.0, g: 0.85, b: 0.6 }
  shadows: false
